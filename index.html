<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Display Aktivierer</title>
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StayAwake">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-active: #10b981;
            --accent-inactive: #3b82f6;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .status-indicator {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 2rem;
            background: #f43f5e;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.4);
            transition: all 0.4s ease;
        }

        .status-indicator.active {
            background: var(--accent-active);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.6);
        }

        .status-indicator svg {
            width: 50px;
            height: 50px;
            fill: #fff;
        }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 0.5rem 0;
            font-weight: 700;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0 0 2.5rem 0;
        }

        .btn {
            background-color: var(--accent-inactive);
            color: white;
            border: none;
            padding: 1.2rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
            transition: all 0.2s ease;
        }

        .btn.active {
            background-color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="indicator" class="status-indicator">
            <svg viewBox="0 0 24 24">
                <path d="M12 2F7 7 0 0 0 5 9c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7zm2 15h-4v-1h4zm1.16-3.15a1 1 0 0 0-.41.85V15h-5v-.3a1 1 0 0 0-.41-.85A4.96 4.96 0 0 1 7 9a5 5 0 0 1 10 0 4.96 4.96 0 0 1-1.84 3.85zM10 20h4a1 1 0 0 1 0 2h-4a1 1 0 0 1 0-2z"/>
            </svg>
        </div>
        
        <h1 id="title">Wachmodus AUS</h1>
        <p id="description">Tippe unten auf den Button, damit das iPad Air 2 aktiv bleibt.</p>
        
        <button id="actionBtn" class="btn">iPad wach halten</button>
    </div>

    <script>
        const actionBtn = document.getElementById('actionBtn');
        const indicator = document.getElementById('indicator');
        const title = document.getElementById('title');
        const description = document.getElementById('description');
        
        let isActive = false;
        let intervalId = null;

        function toggleMode() {
            isActive = !isActive;
            
            if (isActive) {
                indicator.classList.add('active');
                title.textContent = "Wachmodus AN";
                description.textContent = "Das Display bleibt dauerhaft eingeschaltet. Schließe diese App nicht.";
                actionBtn.textContent = "Wachmodus beenden";
                actionBtn.classList.add('active');
                
                // Universelle iOS 15 Methode: Verhindert den Auto-Lock durch einen simulierten Seitenzugriff/Refresh im Hintergrund
                intervalId = setInterval(function() {
                    window.location.href = window.location.href;
                }, 45000); // Lädt die App alle 45 Sekunden unsichtbar neu bzw. hält die Session aktiv
                
            } else {
                indicator.classList.remove('active');
                title.textContent = "Wachmodus AUS";
                description.textContent = "Tippe unten auf den Button, damit das iPad Air 2 aktiv bleibt.";
                actionBtn.textContent = "iPad wach halten";
                actionBtn.classList.remove('active');
                
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
            }
        }

        actionBtn.addEventListener('click', toggleMode);
    </script>
</body>
</html>
