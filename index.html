<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Display Aktivierer</title>
    
    <!-- Apple Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Wach bleiben">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-active: #10b981;
            --accent-inactive: #f43f5e;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .status-indicator {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 2rem;
            background: var(--accent-inactive);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px var(--accent-inactive);
            transition: all 0.5s ease;
        }

        .status-indicator.active {
            background: var(--accent-active);
            box-shadow: 0 0 30px var(--accent-active);
        }

        .status-indicator svg {
            width: 50px;
            height: 50px;
            fill: #fff;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
            background-color: #2563eb;
        }

        .fallback-info {
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="indicator" class="status-indicator">
            <!-- Icon: Glühbirne / Auge -->
            <svg viewBox="0 0 24 24">
                <path d="M12 2F7 7 0 0 0 5 9c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7zm2 15h-4v-1h4zm1.16-3.15a1 1 0 0 0-.41.85V15h-5v-.3a1 1 0 0 0-.41-.85A4.96 4.96 0 0 1 7 9a5 5 0 0 1 10 0 4.96 4.96 0 0 1-1.84 3.85zM10 20h4a1 1 0 0 1 0 2h-4a1 1 0 0 1 0-2z"/>
            </svg>
        </div>
        
        <h1 id="title">Display-Sperre aktiv</h1>
        <p id="description">iOS blockiert das automatische Off-Sperren standardmäßig. Tippe unten auf den Button, um den Wachmodus zu starten.</p>
        
        <button id="actionBtn" class="btn">Wachmodus aktivieren</button>
        
        <!-- Verstecktes Video als Fallback, falls MDM-Profile die Wake-Lock API blockieren -->
        <video id="fallbackVideo" loop playsinline muted style="display:none; width:1px; height:1px;">
            <source src="data:video/mp4;base64,AAAAIGZ0eXBtcDQyAAAAAG1wNDJpc29tYXZjMQAAADh1bW92AABsbXZoZAAAAADb3bT329209wAAA+gAAnuAAAEAAAEAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIAAAIVdHJhawAAXHRraGQAAAAD292099vdtPcAAAABAAAAAAAAe4AAAAAAAAAAAAAAAQAAAAAAAGgAAAAAABAAAAAAAAAAAAAAAAAAAAARAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAAAsBtZGlhAAAAJG1kaGQAAAAA292099vdtPcAAAcIAAJ7gBV4AAAAAAAAMWhkcmwAAAAAAAAAc21oZAAAAAAAAAAAAAAAJGRpbmYAAAAcYnJlZgAAAAAAAAABYm94eQAAAAAAAAGIbWluZgAAYHN0YmwAAABzdHNkAAAAAAAAAAEAAAAnYXZjMQAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAOAA4AEAAAAAAAUnVwZ2VjdwAAABhhdmNDReference=" type="video/mp4">
        </video>
        <div class="fallback-info">Unterstützt Screen Wake Lock & Video-Loop Fallback.</div>
    </div>

    <script>
        const actionBtn = document.getElementById('actionBtn');
        const indicator = document.getElementById('indicator');
        const title = document.getElementById('title');
        const description = document.getElementById('description');
        const video = document.getElementById('fallbackVideo');
        
        let wakeLock = null;
        let isActive = false;

        async function activateWakeLock() {
            try {
                // Hauptmethode: Modernes Screen Wake Lock API
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    
                    // Event abfangen, falls das System den Lock verliert (z.B. Tab-Wechsel)
                    wakeLock.addEventListener('release', () => {
                        if (isActive) deactivateUI();
                    });
                }
                
                // Fallback-Methode: Unsichtbaren Mini-Video-Loop abspielen (wichtig für restriktive iOS-Geräte)
                await video.play();
                
                updateUI(true);
            } catch (err) {
                console.error(`Fehler beim Aktivieren: ${err.message}`);
                // Wenn Wake Lock fehlschlägt, probieren wir rein das Video
                try {
                    await video.play();
                    updateUI(true);
                } catch (vErr) {
                    alert('Aktivierung fehlgeschlagen. Bitte direkt auf den Button tippen!');
                }
            }
        }

        function deactivateWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
            video.pause();
            updateUI(false);
        }

        function updateUI(on) {
            isActive = on;
            if (on) {
                indicator.classList.add('active');
                title.textContent = "Display bleibt WACH";
                description.textContent = "Die App verhindert aktiv das Ausschalten deines Displays. Schließe die App nicht.";
                actionBtn.textContent = "Wachmodus beenden";
                actionBtn.style.backgroundColor = "var(--accent-inactive)";
            } else {
                indicator.classList.remove('active');
                title.textContent = "Display-Sperre aktiv";
                description.textContent = "iOS blockiert das automatische Off-Sperren standardmäßig. Tippe unten auf den Button, um den Wachmodus zu starten.";
                actionBtn.textContent = "Wachmodus aktivieren";
                actionBtn.style.backgroundColor = "#3b82f6";
            }
        }

        actionBtn.addEventListener('click', () => {
            if (!isActive) {
                activateWakeLock();
            } else {
                deactivateWakeLock();
            }
        });

        // Automatisch reaktivieren, wenn die App aus dem Hintergrund zurückkommt
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && isActive) {
                await activateWakeLock();
            }
        });
    </script>
</body>
</html>
